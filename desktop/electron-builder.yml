appId: com.suink.diana.desktop
productName: Diana
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: diana-desktop-macos-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: diana-desktop-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: Network
  artifactName: diana-desktop-linux-${arch}.${ext}
