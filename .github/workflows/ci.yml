name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  NODE_VERSION: "22"

jobs:
  build-version:
    name: Resolve Build Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
      canary: ${{ steps.version.outputs.canary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate
        id: version
        shell: bash
        run: |
          SOURCE_VERSION="$(tr -d '[:space:]' < model/version/VERSION)"
          CANARY=false
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_VERSION="${GITHUB_REF#refs/tags/}"
            if [[ ! "${BUILD_VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
              echo "Release tag must be a semantic version such as v0.8.7: ${BUILD_VERSION}" >&2
              exit 1
            fi
            # 源码基线必须和发布标签一致，否则未注入版本号的构建会报出过期版本。
            if [[ "${SOURCE_VERSION}" != "${BUILD_VERSION}" ]]; then
              echo "model/version/VERSION (${SOURCE_VERSION}) must match the release tag ${BUILD_VERSION}" >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]]; then
            # 每次合并到 main 发一个 Canary：基线是最新正式版的下一个修订号，序号取已有 Canary 的最大值加一。
            STABLE="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "${STABLE}" ]]; then
              echo "No stable release tag to derive the canary version from" >&2
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<<"${STABLE#v}"
            CORE="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            LAST="$(git tag -l "${CORE}-canary.*" | sed "s/^${CORE}-canary\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
            BUILD_VERSION="${CORE}-canary.$(( ${LAST:-0} + 1 ))"
            CANARY=true
          else
            BUILD_VERSION="${GITHUB_SHA:0:7}"
          fi
          CHANNEL=release
          if [[ "${BUILD_VERSION}" == *-beta.* ]]; then CHANNEL=beta; fi
          if [[ "${BUILD_VERSION}" == *-rc.* ]]; then CHANNEL=beta; fi
          if [[ "${CANARY}" == true ]]; then CHANNEL=canary; fi
          echo "channel=${CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "value=${BUILD_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "canary=${CANARY}" >> "${GITHUB_OUTPUT}"

  backend:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Verify gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test ./...

  frontend-next:
    name: Vue Next Typecheck Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend-next dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-dist
          path: frontend-next/dist
          if-no-files-found: error

  build:
    name: Build WebUI
    runs-on: ubuntu-latest
    needs:
      - build-version
      - backend
      - frontend-next
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download frontend-next dist
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: frontend-next-dist
          path: release/frontend-next-dist

      - name: Build
        env:
          BUILD_VERSION: ${{ needs.build-version.outputs.value }}
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist release/package
          binary_name="diana-webui-${{ matrix.suffix }}"
          runtime_name="diana-webui"
          package_suffix="${{ matrix.suffix }}"
          package_suffix="${package_suffix%.exe}"
          package_suffix="${package_suffix/darwin-/macos-}"
          package_name="diana-${package_suffix}"
          package_dir="release/package/${package_name}"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            runtime_name="diana-webui.exe"
          fi

          # Release 包带齐运行时前端，下载后不需要 Go、Node 或源码。
          mkdir -p "${package_dir}/frontend-next/dist"
          go build -trimpath -ldflags="-s -w -X main.buildVersion=${BUILD_VERSION}" -o "${package_dir}/${runtime_name}" ./cmd/webui
          # Keep one compatibility copy so pre-migration updaters can install
          # the first package that introduces the stable runtime name.
          cp "${package_dir}/${runtime_name}" "${package_dir}/${binary_name}"
          cp -R release/frontend-next-dist/. "${package_dir}/frontend-next/dist/"
          # 自带官方 gitea-mcp：校验和对不上就在这里失败，不会发出去。MCP 预设按
          # 主程序旁边的位置拉起它，所以必须和 diana-webui 放在同一层。
          scripts/fetch-gitea-mcp.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "${package_dir}"
          printf '%s\n' \
            "Diana ${BUILD_VERSION}" \
            '' \
            'Run ./run.sh on Linux/macOS or run.bat on Windows.' \
            'Default WebUI port: 18080' \
            'Set DIANA_ADMIN_PASSWORD before first start to choose the administrator password.' \
            'The frontend is included under frontend-next/dist.' \
            'One-click installations expose `diana uninstall`; this package also includes an uninstall script.' \
            'Future stable Releases can be installed from the WebUI with SHA-256 verification, backup, restart, and health-check rollback.' > "${package_dir}/README.txt"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cp scripts/uninstall.ps1 "${package_dir}/uninstall.ps1"
            printf '%s\n' \
              '@echo off' \
              'set "FRONTEND_DIST=%~dp0frontend-next\dist"' \
              'if "%PORT%"=="" set PORT=18080' \
              '"%~dp0diana-webui.exe" %*' > "${package_dir}/run.bat"
            (cd release/package && zip -qr "../../dist/${package_name}.zip" "${package_name}")
          else
            cp scripts/uninstall.sh "${package_dir}/uninstall.sh"
            chmod +x "${package_dir}/uninstall.sh"
            printf '%s\n' \
              '#!/usr/bin/env sh' \
              'set -eu' \
              'SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
              'export FRONTEND_DIST="${FRONTEND_DIST:-$SCRIPT_DIR/frontend-next/dist}"' \
              'export PORT="${PORT:-18080}"' \
              'exec "$SCRIPT_DIR/diana-webui" "$@"' > "${package_dir}/run.sh"
            chmod +x "${package_dir}/run.sh"
            tar -czf "dist/${package_name}.tar.gz" -C release/package "${package_name}"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diana-package-${{ matrix.suffix }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  docker:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    needs:
      - build-version
      - backend
      - frontend-next
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/suink/diana
          # latest 由下面的显式条目控制；默认的 latest=auto 会给每个标签构建都加上 latest。
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && needs.build-version.outputs.channel == 'release' }}
            type=raw,value=${{ needs.build-version.outputs.channel }},enable=${{ (startsWith(github.ref, 'refs/tags/v') || needs.build-version.outputs.canary == 'true') && needs.build-version.outputs.channel != 'release' }}
            type=raw,value=${{ needs.build-version.outputs.value }},enable=${{ needs.build-version.outputs.canary == 'true' }}
            type=sha

      # slim 变体与完整版同名同 tag，统一加 -slim 后缀，例如 latest-slim / v0.8.126-slim。
      - name: Docker metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/suink/diana
          # 必须关掉：suffix 只加在各条目上，自动生成的 latest 不带 -slim，
          # slim 又在完整版之后推送，会把完整版的 latest 覆盖成 slim 镜像。
          flavor: latest=false
          tags: |
            type=ref,event=tag,suffix=-slim
            type=raw,value=latest-slim,enable=${{ startsWith(github.ref, 'refs/tags/v') && needs.build-version.outputs.channel == 'release' }}
            type=raw,value=${{ needs.build-version.outputs.channel }}-slim,enable=${{ (startsWith(github.ref, 'refs/tags/v') || needs.build-version.outputs.canary == 'true') && needs.build-version.outputs.channel != 'release' }}
            type=raw,value=${{ needs.build-version.outputs.value }}-slim,enable=${{ needs.build-version.outputs.canary == 'true' }}
            type=sha,suffix=-slim

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.build-version.outputs.value }}

      - name: Build and publish slim Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: runtime-slim
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.build-version.outputs.value }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-version
      - build
      - docker
    if: startsWith(github.ref, 'refs/tags/v') || needs.build-version.outputs.canary == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download complete packages
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: diana-package-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum diana-*.tar.gz diana-*.zip > SHA256SUMS

      - name: Generate static update manifest
        working-directory: release
        env:
          RELEASE_CHANNEL: ${{ needs.build-version.outputs.channel }}
          RELEASE_TAG: ${{ needs.build-version.outputs.value }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          assets='[]'
          for file in diana-*.tar.gz diana-*.zip SHA256SUMS; do
            assets=$(jq --arg name "$file" --arg url "https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}/${file}" --argjson size "$(stat -c %s "$file")" '. + [{name: $name, url: $url, size: $size}]' <<<"$assets")
          done
          jq -n \
            --argjson prerelease "$([[ "$RELEASE_CHANNEL" == release ]] && echo false || echo true)" \
            --arg tag "$RELEASE_TAG" \
            --arg name "Diana $RELEASE_TAG" \
            --arg url "https://github.com/${RELEASE_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson assets "$assets" \
            '{schema: 1, releases: [{prerelease: $prerelease, tag: $tag, name: $name, date: $date, url: $url, checksum_available: true, checksum_url: ($assets[] | select(.name == "SHA256SUMS") | .url), assets: $assets}]}' \
            > latest.json

      - name: Write canary release notes
        if: needs.build-version.outputs.canary == 'true'
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "main 分支合并后自动构建的 Canary 预览版，未经人工验证，只推送给选择 Canary 更新通道的实例。发布正式版时自动删除。"
            echo
            echo "- 提交：${GITHUB_SHA}"
            echo "- 改动：$(head -n 1 <<<"${COMMIT_SUBJECT}")"
          } > release/NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-version.outputs.value }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ needs.build-version.outputs.canary == 'true' && 'release/NOTES.md' || '' }}
          name: ${{ needs.build-version.outputs.value }}
          prerelease: ${{ needs.build-version.outputs.channel != 'release' }}
          make_latest: ${{ needs.build-version.outputs.channel == 'release' }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
            release/latest.json

      - name: Prune superseded canary releases
        if: needs.build-version.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-version.outputs.value }}
        run: |
          # 更新器只看最近 30 条 Release，不清理的话 Canary 会把正式版挤出去。只删 Canary，手动发布的 Beta/RC 保留。
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json tagName --jq '.[].tagName' |
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$' || true; } |
            while read -r tag; do
              if [[ "$(printf '%s\n%s\n' "${tag%%-*}" "${RELEASE_TAG}" | sort -V | tail -n 1)" == "${RELEASE_TAG}" ]]; then
                gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || echo "::warning::failed to delete ${tag}"
              fi
            done
