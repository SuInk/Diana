name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  NODE_VERSION: "22"

jobs:
  build-version:
    name: Resolve Build Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整的 tag 列表才能判断这个版本是不是已经发过。
          fetch-depth: 0

      - name: Resolve and validate
        id: version
        shell: bash
        run: |
          SOURCE_VERSION="$(tr -d '[:space:]' < model/version/VERSION)"
          RELEASE_TAG=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_VERSION="${GITHUB_REF#refs/tags/}"
            if [[ ! "${BUILD_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must be a semantic version such as v0.8.7: ${BUILD_VERSION}" >&2
              exit 1
            fi
            # 源码基线必须和发布标签一致，否则未注入版本号的构建会报出过期版本。
            if [[ "${SOURCE_VERSION}" != "${BUILD_VERSION}" ]]; then
              echo "model/version/VERSION (${SOURCE_VERSION}) must match the release tag ${BUILD_VERSION}" >&2
              exit 1
            fi
            RELEASE_TAG="${BUILD_VERSION}"
          else
            BUILD_VERSION="${GITHUB_SHA:0:7}"
            # 主线上版本号涨了就发版：判据是「这个版本还没有对应的 tag」，不是
            # 「这次推送改了 VERSION」——后者在重跑、回滚合并和多次推送时都会误判，
            # 而前者天然幂等，重跑一次不会重复发布。
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" =~ ^refs/heads/(main|master)$ ]]; then
              if [[ ! "${SOURCE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
                echo "model/version/VERSION is not a release version, skipping release: ${SOURCE_VERSION}"
              elif git rev-parse -q --verify "refs/tags/${SOURCE_VERSION}" >/dev/null; then
                echo "Tag ${SOURCE_VERSION} already exists, skipping release"
              else
                RELEASE_TAG="${SOURCE_VERSION}"
                # 二进制里注入的版本号要和将要打出的 tag 一致，否则发出去的包
                # 自报的是 commit 短号。
                BUILD_VERSION="${SOURCE_VERSION}"
              fi
            fi
          fi
          echo "value=${BUILD_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

  backend:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Verify gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test ./...

  frontend-next:
    name: Vue Next Typecheck Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend-next dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-dist
          path: frontend-next/dist
          if-no-files-found: error

  build:
    name: Build WebUI
    runs-on: ubuntu-latest
    needs:
      - build-version
      - backend
      - frontend-next
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Download frontend-next dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-next-dist
          path: release/frontend-next-dist

      - name: Build
        env:
          BUILD_VERSION: ${{ needs.build-version.outputs.value }}
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist release/package
          binary_name="diana-webui-${{ matrix.suffix }}"
          runtime_name="diana-webui"
          package_suffix="${{ matrix.suffix }}"
          package_suffix="${package_suffix%.exe}"
          package_name="diana-webui-${package_suffix}"
          package_dir="release/package/${package_name}"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            runtime_name="diana-webui.exe"
          fi

          go build -trimpath -ldflags="-s -w -X main.buildVersion=${BUILD_VERSION}" -o "dist/${binary_name}" ./cmd/webui

          # Release 包带齐运行时前端，下载后不需要 Go、Node 或源码。
          mkdir -p "${package_dir}/frontend-next/dist"
          cp "dist/${binary_name}" "${package_dir}/${runtime_name}"
          # Keep one compatibility copy so pre-migration updaters can install
          # the first package that introduces the stable runtime name.
          cp "dist/${binary_name}" "${package_dir}/${binary_name}"
          cp -R release/frontend-next-dist/. "${package_dir}/frontend-next/dist/"
          printf '%s\n' \
            "Diana ${BUILD_VERSION}" \
            '' \
            'Run ./run.sh on Linux/macOS or run.bat on Windows.' \
            'Default WebUI port: 18080' \
            'Set DIANA_ADMIN_PASSWORD before first start to choose the administrator password.' \
            'The frontend is included under frontend-next/dist.' \
            'One-click installations expose `diana uninstall`; this package also includes an uninstall script.' \
            'Future stable Releases can be installed from the WebUI with SHA-256 verification, backup, restart, and health-check rollback.' > "${package_dir}/README.txt"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            cp scripts/uninstall.ps1 "${package_dir}/uninstall.ps1"
            printf '%s\n' \
              '@echo off' \
              'set "FRONTEND_DIST=%~dp0frontend-next\dist"' \
              'if "%PORT%"=="" set PORT=18080' \
              '"%~dp0diana-webui.exe" %*' > "${package_dir}/run.bat"
            (cd release/package && zip -qr "../../dist/${package_name}.zip" "${package_name}")
          else
            cp scripts/uninstall.sh "${package_dir}/uninstall.sh"
            chmod +x "${package_dir}/uninstall.sh"
            printf '%s\n' \
              '#!/usr/bin/env sh' \
              'set -eu' \
              'SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
              'export FRONTEND_DIST="${FRONTEND_DIST:-$SCRIPT_DIR/frontend-next/dist}"' \
              'export PORT="${PORT:-18080}"' \
              'exec "$SCRIPT_DIR/diana-webui" "$@"' > "${package_dir}/run.sh"
            chmod +x "${package_dir}/run.sh"
            tar -czf "dist/${package_name}.tar.gz" -C release/package "${package_name}"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diana-webui-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    needs:
      - build-version
      - backend
      - frontend-next
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/suink/diana
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.build-version.outputs.value }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      # build-version 必须直接列在这里：needs 上下文只暴露直接依赖，
      # 靠 build 传递过来是取不到 outputs 的。
      - build-version
      - build
      - docker
    # 发布不再只认 tag 推送：主线上版本号涨了就发。tag 由这一步自己创建，
    # 用的是 Actions 自带的 GITHUB_TOKEN，不需要谁手动推一个 tag 上来。
    if: needs.build-version.outputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: diana-webui-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum diana-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # tag 不存在时 action 会在 target_commitish 上建出来；tag 推送触发时
          # 这两个值就是那个 tag 自己，行为不变。
          tag_name: ${{ needs.build-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/*
