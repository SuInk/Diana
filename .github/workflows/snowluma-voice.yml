# 带 QQ 语音通话组件的 SnowLuma 镜像，见 docs/qq-voice-call.md。
# 和 Diana 主镜像分开发：它跟着 SnowLuma 的版本走，不跟 Diana 的版本走。
name: SnowLuma Voice Image

on:
  push:
    branches:
      - main
    paths:
      - packaging/snowluma-voice/**
      - cmd/qqcall-agent/**
      - model/qqcall/**
      - internal/safego/**
      - internal/dlog/**
      - .github/workflows/snowluma-voice.yml
  pull_request:
    branches:
      - main
    paths:
      - packaging/snowluma-voice/**
      - cmd/qqcall-agent/**
      - model/qqcall/**
      - internal/safego/**
      - internal/dlog/**
      - .github/workflows/snowluma-voice.yml
  workflow_dispatch:
    inputs:
      snowluma_version:
        description: 上游 SnowLuma 镜像版本，例如 v1.14.10；留空用 Dockerfile 里的默认值
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build${{ github.event_name != 'pull_request' && ' and Publish' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 发布用的 SnowLuma 版本：手动触发时取输入，否则取 Dockerfile 的默认值，
      # 镜像标签和它一致，例如 ghcr.io/suink/snowluma-voice:v1.14.10。
      - name: Resolve SnowLuma version
        id: upstream
        env:
          INPUT: ${{ inputs.snowluma_version }}
        run: |
          version="${INPUT}"
          if [ -z "${version}" ]; then
            version="$(sed -n 's/^ARG SNOWLUMA_IMAGE=.*:\(v[0-9][^ ]*\)$/\1/p' packaging/snowluma-voice/Dockerfile)"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "SnowLuma version must look like v1.14.10: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/suink/snowluma-voice
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/snowluma-voice/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SNOWLUMA_IMAGE=motricseven7/snowluma:${{ steps.upstream.outputs.version }}
