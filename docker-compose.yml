services:
  diana:
    build: .
    image: diana:latest
    container_name: diana
    restart: unless-stopped
    ports:
      - "18080:18080"
    volumes:
      # data 目录放 SQLite（配置、管理员凭据、插件状态）和入站图片缓存，
      # 不挂出来的话容器重建就全丢了。
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      PORT: "18080"
      LOG_PATH: "/app/logs/diana.log"
      DIANA_LOCAL_MEDIA_BASE_URL: "http://diana:18080/media/resolver"
      DIANA_ADMIN_PASSWORD: "change-this-admin-password"
      QQBOT_ENABLED: "true"
      ONEBOT_REVERSE_WS_ENDPOINT: "ws://127.0.0.1:18080/onebot/v11/ws"
      ONEBOT_ACCESS_TOKEN: "change-me"
      NONEBOT_BRIDGE_ENABLED: "false"
      NONEBOT_BRIDGE_ENDPOINT: "ws://127.0.0.1:8080/onebot/v11/ws"
      NONEBOT_BRIDGE_TOKEN: ""
      QQBOT_QQ: "10001"
      LLM_PROVIDER: "openai_compatible"
      LLM_API_KEY: "change-me"
      LLM_MODEL: "gp5.5"
      LLM_USER_AGENT: "codex-cli/0.142.0"
