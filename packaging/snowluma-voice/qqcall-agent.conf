; 和 QQ 同一个用户、同一个 X 屏幕和 PulseAudio 会话，才看得到通话窗口、接得上声卡。
[program:qqcall-agent]
command=/usr/local/bin/qqcall-agent
directory=/app
user=snowluma
priority=20
autostart=true
; 没设 QQCALL_TOKEN 时 agent 正常退出，不要反复拉起。
autorestart=unexpected
exitcodes=0
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
